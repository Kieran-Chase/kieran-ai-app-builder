spring:
  application:
    name: kieran-ai-app-builder-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kieran_ai_app_builder
    username: root
    password: root
  #激活本地配置
  profiles:
    active: local


server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: pers.kieran.study.kieranaiappbuilder.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


