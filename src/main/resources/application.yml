spring:
  application:
    name: kieran-ai-app-builder-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kieran_ai_app_builder
    username: root
    password: root
  #redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600 #缓存过期时间（秒）
      database: 0
  #激活本地配置
  profiles:
    active: local


server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: pers.kieran.study.kieranaiappbuilder.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
r2:
  client:
    host: https://img.wqc6.cc
    region: auto
    bucket: ai-cover-images

